# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ai:10m rate=5r/m;

# Map: route _next/static to Payload CMS (:3001) if referer is /admin
map $http_referer $next_backend {
    default http://127.0.0.1:3000;
    ~*/admin http://127.0.0.1:3001;
}

# Map: route _next/static to Payload CMS if payload_admin cookie exists
map $cookie_payload_admin $next_backend_cookie {
    default "";
    "1" http://127.0.0.1:3001;
}

# HTTP -> HTTPS redirect (canonicalize to non-www)
server {
    listen 80;
    listen [::]:80;
       server_name xn--80adbka9ab1c.xn--p1acf www.xn--80adbka9ab1c.xn--p1acf;

    # ACME challenge для certbot (НЕ редиректить)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS www -> non-www 301 redirect (canonical)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
       server_name www.xn--80adbka9ab1c.xn--p1acf;

    ssl_certificate /etc/letsencrypt/live/xn--80adbka9ab1c.xn--p1acf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80adbka9ab1c.xn--p1acf/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://xn--80adbka9ab1c.xn--p1acf$request_uri;
}

# HTTPS main server (non-www canonical)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
       server_name xn--80adbka9ab1c.xn--p1acf;

    ssl_certificate /etc/letsencrypt/live/xn--80adbka9ab1c.xn--p1acf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80adbka9ab1c.xn--p1acf/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # === ОПТИМИЗАЦИЯ СКОРОСТИ ===
    # Preconnect для шрифтов
    add_header Link '<https://fonts.gstatic.com>; rel=preconnect; crossorigin' always;
    
    # Кэш статических ресурсов (1 год)
    location ~* ^/(?!api/).*\.(webp|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    
    # Кэш CSS/JS (1 год, immutable)
    # Route to Payload CMS (:3001) if referer contains /admin, otherwise frontend (:3000)
    location ~* /_next/static/ {
        proxy_pass $next_backend;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # === Blog editor + admin scripts ===
    location = /wysiwyg-inject.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
    location = /blog-editor-nav.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location /admin/blog-editor {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Set-Cookie "payload_admin=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payload CMS Admin
    location /admin {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        add_header Set-Cookie "payload_admin=1; Path=/; HttpOnly; SameSite=Lax; Max-Age=3600" always;
    }

    # Next.js static — маршрутизация по cookie
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        if ($cookie_payload_admin) {
            proxy_pass http://127.0.0.1:3001;
        }
        if ($http_referer ~* "/admin") {
            proxy_pass http://127.0.0.1:3001;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /_next/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $next_backend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Frontend API endpoints (rate-limited per service)
    location = /api/health {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/leads {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Express audit endpoint (LLM анализ устава: upload + DeepSeek, long timeout)
    location = /api/express-audit {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=ai burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }


    location = /api/audit {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI endpoint — stricter rate limit (5 req/min per IP)
    location = /api/ai {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=ai burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/me {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/enroll {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/progress {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/payment/create {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # YooKassa webhook — no rate limit (YooKassa retries on 429)
    # Protected at app level by source IP check + payment re-verification
    location = /api/payment/webhook {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media files (blog images, cover images) — fetched in parallel (5-8 per page)
    # NOT rate-limited (would cause 503 on every page load with multiple images)
    # Cached for 7 days on browser side (immutable static content)
    location ^~ /api/media/file/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # Payload globals (header, footer) — fetched on every page navigation
    # NOT rate-limited (would cause "This page couldn't load" on rapid navigation)
    # Cached for 60s to reduce Payload load
    location = /api/globals/header {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Cache 60s on browser side
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
    }

    location = /api/globals/footer {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
    }

    # Payload REST API (default for /api/* not matched above)
    location /api {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Payload GraphQL -> :3001
    location /graphql {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payload media -> :3001
    location /media {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # Static images — cache
    location ~* ^/images/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
    }

    # SEO: редирект старых URL курсов → канонический
    location = /courses {
        return 301 /kursy-obuchenie-potrebitelskoy-kooperatsii-onlayn;
    }
    location = /kursy {
        return 301 /kursy-obuchenie-potrebitelskoy-kooperatsii-onlayn;
    }

    # Next.js API routes for client projects (dashboard) -> :3000
    location /api/client-projects/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Default: Next.js Frontend -> :3000
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # Override Next.js default Cache-Control (private, no-store)
        # ISR pages can be safely cached on browser side for 60s with SWR
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}